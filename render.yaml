databases:
  - name: fuel-route-optimizer-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: fuel-route-optimizer
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fuel-route-optimizer-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: DJANGO_TRUST_PROXY_SSL_HEADER
        value: "true"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "true"
      - key: DJANGO_SECURE_HSTS_PRELOAD
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: AUTO_INITIALIZE_DATA
        value: "true"
      - key: REFRESH_FUEL_PRICES
        value: "false"
      - key: FUEL_CSV_PATH
        value: /etc/secrets/fuel-prices-for-be-assessment.csv.gz.b64
      - key: GEOCODING_ENABLED
        value: "false"
      - key: OSRM_BASE_URL
        value: https://router.project-osrm.org
      - key: HTTP_CONNECT_TIMEOUT
        value: "5"
      - key: HTTP_READ_TIMEOUT
        value: "20"

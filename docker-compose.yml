services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/var/db.sqlite3
      FUEL_PRICES_CSV: /app/input/fuel-prices-for-be-assessment.csv
    volumes:
      - app-state:/app/var
      - geographic-data:/app/data/geographic
      - ./data:/app/input:ro
    restart: unless-stopped
volumes:
  app-state:
  geographic-data:
